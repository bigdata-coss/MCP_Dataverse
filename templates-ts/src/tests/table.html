
<!DOCTYPE html>
<html>
<head>

  <title>테이블 테스트</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid black; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>테이블 테스트</h1>
  <table><thead><tr><th>열1</th><th>열2</th><th>열3</th></tr></thead><tbody><tr><td>값1</td><td>값2</td><td>값3</td></tr><tr><td>값4</td><td>값5</td><td>값6</td></tr></tbody></table>
</body>
</html>
